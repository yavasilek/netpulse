name: Ошибка
description: Сообщить о воспроизводимой проблеме NetPulse
title: "[Bug] "
labels: ["bug"]
body:
  - type: input
    id: device
    attributes:
      label: Устройство и Android
      placeholder: Pixel 8, Android 16
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как воспроизвести
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое и фактическое поведение
    validations:
      required: true
