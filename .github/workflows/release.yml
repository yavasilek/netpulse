name: Release APK

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.NETPULSE_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/netpulse-release.jks"

      - name: Test, lint and assemble release
        env:
          NETPULSE_KEYSTORE_FILE: ${{ runner.temp }}/netpulse-release.jks
          NETPULSE_KEYSTORE_PASSWORD: ${{ secrets.NETPULSE_KEYSTORE_PASSWORD }}
          NETPULSE_KEY_ALIAS: ${{ secrets.NETPULSE_KEY_ALIAS }}
          NETPULSE_KEY_PASSWORD: ${{ secrets.NETPULSE_KEY_PASSWORD }}
          NETPULSE_VERSION_NAME: ${{ github.ref_name }}
          NETPULSE_VERSION_CODE: ${{ github.run_number }}
        run: |
          export NETPULSE_VERSION_NAME="${NETPULSE_VERSION_NAME#v}"
          ./gradlew testDebugUnitTest lintRelease assembleRelease --no-daemon

      - name: Package release
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "NetPulse-${VERSION}.apk"
          sha256sum "NetPulse-${VERSION}.apk" > "NetPulse-${VERSION}.apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          gh release create "$TAG_NAME" \
            "NetPulse-${VERSION}.apk" \
            "NetPulse-${VERSION}.apk.sha256" \
            --title "NetPulse ${VERSION}" \
            --generate-notes \
            --verify-tag
